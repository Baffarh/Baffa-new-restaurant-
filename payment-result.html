<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment result | TMAX Restaurant</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="wrap" style="max-width:650px;padding-top:70px"><a class="brand" href="/"><span class="brand-icon">T</span><span>TMAX <small>RESTAURANT</small></span></a><section class="contact-card" style="margin-top:35px"><span class="eyebrow">CHECKOUT UPDATE</span><h1 id="heading" style="font-family:Manrope,sans-serif;letter-spacing:-.05em">Checking your payment…</h1><p class="muted" id="message">Please wait while we verify your payment with the payment provider.</p><p><b id="reference"></b></p><a class="button primary" href="/">Return to restaurant</a><p class="tiny muted">Keep your payment reference. If money was deducted but this page does not confirm success, contact the restaurant before paying again.</p></section></main>
<script>
(async()=>{const params=new URLSearchParams(location.search);const reference=params.get("reference");const heading=document.getElementById("heading"),message=document.getElementById("message"),ref=document.getElementById("reference");if(!reference){heading.textContent="No payment reference found";message.textContent="Return to the restaurant and check your order, or contact the restaurant if you were charged.";return}ref.textContent="Reference: "+reference;try{const r=await fetch("/api/payments/verify?reference="+encodeURIComponent(reference));const d=await r.json();if(!r.ok)throw new Error(d.error||"Verification unavailable");if(d.verified){heading.textContent="Payment confirmed";message.textContent="Paystack reports a successful payment. Please save your reference for any order enquiry."}else{heading.textContent="Payment not confirmed";message.textContent="Current payment status: "+d.status+". Do not pay again immediately if your bank shows a debit; contact the restaurant to confirm."}}catch(e){heading.textContent="We couldn't verify the payment";message.textContent=e.message+" Keep your reference and contact the restaurant before retrying."}})();
</script></body></html>
